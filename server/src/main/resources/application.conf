ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ ru.itmo.tuman.catalog.ApplicationKt.module ]
    }
}

catalog {
    # Путь к папке с наборами. Относительный путь считается от папки запуска
    # (./gradlew :server:run запускает сервер из корня репозитория).
    contentDir = "content"
    contentDir = ${?CONTENT_DIR}
}
